# Shared, immutable worker defaults for write (implementation/authoring) runs.
# Per-work-order state lives in HERMES_HOME.
model: ""
providers: {}
fallback_providers:
  - provider: openai-codex
    model: gpt-6-sol
  - provider: openrouter
    model: xiaomi/mimo-v2.6-pro
toolsets:
  - file
  - search
  - terminal
  - skills
agent:
  reasoning_effort: medium
  reasoning_overrides:
    gpt-6-sol: xhigh
    gpt-6-astra: xhigh
    xiaomi/mimo-v2.6-pro: xhigh
memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true
skills:
  external_dirs: []
plugins:
  enabled: []
security:
  allow_data_training_tiers_noninteractive: true
